name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node 20 has no node:sqlite, so it exercises the WebAssembly fallback; 24 uses the built-in one.
          # pnpm 11 itself needs Node 22.13+, so Node 20 runs with pnpm 10, the pair Replit uses.
          - { node: 20, pnpm: 10 }
          - { node: 24, pnpm: 11 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Tests again on the WebAssembly SQLite backend
        run: THIKRA_SQLITE=wasm pnpm test
