<!doctype html>
<html lang="ar" dir="rtl" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4d3f" />
    <!-- Do not let the browser translate this page.
         The app speaks 21 languages itself and has its own language picker, so a browser translation
         adds nothing - and it costs everything: Chrome rewrites the text nodes under React's feet, and
         the next navigation dies with "removeChild: the node to be removed is not a child of this node",
         leaving a white screen. An Arabic-first app is offered that translation constantly, so this is
         not an edge case. Seen live on tamtim.com before this line existed. -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" sizes="32x32" href="/app-icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/app-icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="تمتم" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Tajawal is self-hosted (web/public/fonts, @font-face in styles.css) so we can
         correct its vertical metrics, which Google's stylesheet would not let us touch.
         Preloading the two faces the first screen needs avoids a flash of fallback text. -->
    <link rel="preload" href="/fonts/tajawal-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/tajawal-400-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <title>تمتم · Tamtim</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
