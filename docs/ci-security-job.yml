# ADD THIS to .github/workflows/ci.yml (under `jobs:`, same indentation as `check:`).
# It is kept here because the GitHub token this project is pushed with has no `workflow` permission, so a push that edits workflow files is refused.
# To add it: paste it in the GitHub web editor, or give the token the `workflow` scope and move it yourself.

  # Supply-chain and secret hygiene (LAUNCH-PLAN P0-6). Production dependencies with a known HIGH or CRITICAL advisory fail the build;
  # the secret scan reads the whole history, so a key committed by mistake is caught even if it was deleted later.
  security:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Secret scan (whole history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
